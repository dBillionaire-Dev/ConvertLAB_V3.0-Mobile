name: "💡 Feature request"
description: Suggest an improvement to the app
title: "Feature: <short description>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who is affected and in what situation?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Calculators
        - Conversions
        - Lab tools
        - Search
        - History / Favorites
        - Settings / Backup
        - Android app
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true
